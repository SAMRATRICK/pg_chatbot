<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayPoint — PG Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Brand Constants */
      --ink: #15170F;
      --paper: #F4F1EA;
      --panel: #FBFAF5;
      --green: #4F7B1E;
      --lime: #C7F04A;
      --line: rgba(21, 23, 15, 0.12);
      
      /* Typography Fallbacks */
      --font-display: 'Inter', system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-display);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Brand Typography Classes */
    .ff-display { font-family: var(--font-display); font-optical-sizing: auto; }
    .ff-mono { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; }

    /* Grain Texture */
    .grain {
      background-image: radial-gradient(rgba(79, 123, 30, 0.08) 0.5px, transparent 0.5px);
      background-size: 18px 18px;
    }

    /* ── Layout shell ─────────────────────────────────────────────────── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      background: var(--paper);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      /* background: var(--ink); */
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.65rem;
      color: #6B6A5C;
    }

    /* ── Quick chips ──────────────────────────────────────────────────── */
    .chips-row {
      display: flex;
      gap: 8px;
      padding: 14px 24px;
      overflow-x: auto;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      font-size: 0.65rem;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chip:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* ── Messages area ────────────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--line); }

    /* ── Message rows ─────────────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease-out both;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatars */
    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .avatar.bot {color: var(--paper); }
    .avatar.user {color: var(--ink); border: 1px solid var(--line); }

    /* Bubbles */
    .bubble {
      max-width: 75%;
      padding: 16px 20px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
      position: relative;
    }

    .msg-row.bot .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .msg-row.user .bubble {
      background: var(--ink);
      color: var(--paper);
    }

    /* Markdown-like formatting inside bot bubbles */
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; color: #6B6A5C; }
    .bubble .sep {
      border: none;
      border-top: 1px solid var(--line);
      margin: 16px 0;
    }

    .bubble .pg-card {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
      transition: transform 0.2s;
    }
    
    .bubble .pg-card:hover {
      transform: translateY(-2px);
    }

    .bubble .pg-card + .pg-card { margin-top: 12px; }

    .bubble .pg-name {
      font-weight: 500;
      font-size: 1.1rem;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .bubble .pg-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    /* Solid Badges matching ExplorePGs */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      padding: 4px 8px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.green { background: var(--green); color: var(--paper); }
    .badge.ink { background: var(--ink); color: var(--paper); }
    .badge.red { background: #D94040; color: var(--paper); }
    .badge.gray { background: #EAE8DF; color: #6B6A5C; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 4px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #6B6A5C;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-4px); opacity: 1; }
    }

    /* Timestamp */
    .ts {
      font-size: 0.6rem;
      color: #6B6A5C;
      margin-top: 6px;
      padding: 0 2px;
      text-align: right;
      font-family: var(--font-mono);
    }
    .msg-row.bot .ts { text-align: left; }

    /* ── Input area ───────────────────────────────────────────────────── */
    .input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--green);
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      padding: 6px 0;
    }

    #msgInput::placeholder { color: #9A9684; }

    .send-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.85;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── Welcome card ─────────────────────────────────────────────────── */
    .welcome-card {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 32px 24px;
      text-align: center;
      margin: 16px 0;
    }

    .welcome-card .wc-icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .welcome-card h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 0.85rem;
      color: #6B6A5C;
      line-height: 1.6;
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .shell { border: none; }
      .messages { padding: 16px; gap: 16px; }
      .bubble { max-width: 90%; font-size: 0.85rem; padding: 14px 16px; }
      .chips-row { padding: 12px 16px; }
      .input-area { padding: 16px; }
      .header { padding: 16px; }
    }
  </style>
</head>

<body class="grain">
<div class="shell">

  <header class="header">
    <div class="brand">
      <div class="brand-icon"><img src="/p1.svg" alt="Pingo Logo" width="40" height="40"></div>
      <div class="brand-text">
        <h1 class="ff-display">Pingo</h1>
        <p class="ff-mono uppercase">StayPoint AI Assistant</p>
      </div>
    </div>
  </header>

  <div class="chips-row ff-mono" id="chipsRow">
    <button class="chip" onclick="chipSend(this)">PG under ₹6000 with WiFi</button>
    <button class="chip" onclick="chipSend(this)">Best rated PGs in Asansol</button>
    <button class="chip" onclick="chipSend(this)">Girls PG with meals</button>
    <button class="chip" onclick="chipSend(this)">Documents required for PG</button>
    <button class="chip" onclick="chipSend(this)">What is security deposit?</button>
    <button class="chip" onclick="chipSend(this)">PG notice period rules</button>
  </div>

  <div class="messages" id="msgList">

    <div class="welcome-card" id="welcomeCard">
      <div class="wc-icon"><img src="/p1.svg" alt="Pingo Logo" width="60" height="60"></div>
      <h2 class="ff-display">Hi, I'm Pingo!</h2>
      <p>
        Your dedicated <strong style="color: var(--ink)">StayPoint</strong> AI assistant.<br>
        Ask me to find PGs in Asansol, or ask about rules, documents, and deposits.<br><br>
        <span class="ff-mono uppercase" style="font-size: 0.65rem;">Supports English · हिंदी · বাংলা</span>
      </p>
    </div>

  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="msgInput"
        rows="1"
        placeholder="Ask about PGs… e.g. 'Girls PG under ₹6000'"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</div><script>
// ─── State ─────────────────────────────────────────────────────────────────
const msgList  = document.getElementById('msgList');
const msgInput = document.getElementById('msgInput');
const sendBtn  = document.getElementById('sendBtn');
let   isTyping = false;

// ─── Auto-grow textarea ────────────────────────────────────────────────────
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

// ─── Send on Enter (Shift+Enter = newline) ─────────────────────────────────
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

// ─── Chip shortcut ─────────────────────────────────────────────────────────
function chipSend(el) {
  msgInput.value = el.textContent.trim();
  sendMessage();
}

// ─── Time helper ───────────────────────────────────────────────────────────
function nowTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ─── Remove welcome card ───────────────────────────────────────────────────
function removeWelcome() {
  const wc = document.getElementById('welcomeCard');
  if (wc) wc.remove();
}

// ─── Append user message ───────────────────────────────────────────────────
function appendUser(text) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div>
      <div class="bubble ff-display">${escHtml(text)}</div>
      <div class="ts">${nowTime()}</div>
    </div>
    <div class="avatar user ff-mono">You</div>
  `;
  msgList.appendChild(row);
  scrollDown();
}

// ─── Typing indicator ──────────────────────────────────────────────────────
function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `
    <div class="avatar bot ff-mono"><img src="/p1.svg" alt="Pingo Logo" width="40" height="40"></div>
    <div class="bubble bot-typing">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  msgList.appendChild(row);
  scrollDown();
}

function hideTyping() {
  const tr = document.getElementById('typingRow');
  if (tr) tr.remove();
}

// ─── Append bot message ────────────────────────────────────────────────────
function appendBot(text, pgs) {
  hideTyping();
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  const bubbleEl = document.createElement('div');
  bubbleEl.className = 'bubble ff-display';

  if (pgs && pgs.length > 0) {
    // Render lead text
    const parts = text.split('\n\n---\n\n');
    const lead  = parts[0];

    bubbleEl.innerHTML = formatBotText(lead);

    // Render individual PG cards
    pgs.forEach((pg, i) => {
      const card = buildPgCard(pg, i + 1);
      bubbleEl.appendChild(card);
    });
  } else {
    bubbleEl.innerHTML = formatBotText(text);
  }

  const wrapper = document.createElement('div');
  wrapper.appendChild(bubbleEl);
  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = nowTime();
  wrapper.appendChild(ts);

  row.innerHTML = `<div class="avatar bot ff-mono"><img src="/p1.svg" alt="Pingo Logo" width="40" height="40"></div>`;
  row.appendChild(wrapper);
  msgList.appendChild(row);
  scrollDown();
}

// ─── Format bot text (bold, newlines) ─────────────────────────────────────
function formatBotText(text) {
  return escHtml(text)
    // **bold**
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // *italic*
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // newlines
    .replace(/\n/g, '<br>');
}

// ─── Build a PG card element ───────────────────────────────────────────────
function buildPgCard(pg, idx) {
  const card = document.createElement('div');
  card.className = 'pg-card';

  const verified   = String(pg.Verified || '').toLowerCase().startsWith('y');
  const wifiBadge  = pg.WiFi  === 'Yes' ? '<span class="badge gray">WiFi</span>'  : '';
  const mealsBadge = pg.Meals === 'Yes' ? '<span class="badge gray">Meals</span>' : '';
  const acBadge    = pg.AC    === 'Yes' ? '<span class="badge gray">AC</span>'    : '';
  
  const vBadge     = verified
    ? '<span class="badge green">Verified</span>'
    : '<span class="badge red">Unverified</span>';

  card.innerHTML = `
    <div class="pg-name ff-display">${idx}. ${escHtml(pg.PG_Name || 'PG')}</div>
    <div class="ff-mono" style="font-size:0.65rem;color:#6B6A5C;margin-bottom:10px;text-transform:uppercase;">📍 ${escHtml(pg.Address || 'Asansol')}</div>
    <div class="pg-row">
      <span class="badge ink">₹${pg.Rent || 'N/A'}/mo</span>
      <span class="badge gray">⭐ ${pg.Rating || 'N/A'}</span>
      <span class="badge gray">${pg.Distance_km || 'N/A'} km</span>
      <span class="badge gray">${pg.Gender_Preference || 'Any'}</span>
    </div>
    <div class="pg-row" style="margin-top:6px">
      ${vBadge} ${wifiBadge} ${mealsBadge} ${acBadge}
    </div>
    <div class="ff-mono" style="font-size:0.65rem;color:var(--ink);margin-top:12px;text-transform:uppercase;">📞 Contact: ${escHtml(String(pg.Contact || 'N/A'))}</div>
  `;
  return card;
}

// ─── Main send function ────────────────────────────────────────────────────
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isTyping) return;

  isTyping = true;
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;

  appendUser(text);
  showTyping();

  try {
    const res  = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    appendBot(data.answer || 'Sorry, no response.', data.pgs || []);
  } catch {
    appendBot('Connection error. Please try again.', []);
  } finally {
    isTyping = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function scrollDown() {
  msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
