<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quanta — PG Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f0f13;
      --surface:    #1a1a22;
      --surface2:   #22222e;
      --border:     rgba(255,255,255,0.07);
      --accent:     #7c6ff7;
      --accent2:    #a78bfa;
      --user-bg:    #7c6ff7;
      --bot-bg:     #1e1e2a;
      --text:       #e8e8f0;
      --text-dim:   #8888a4;
      --green:      #4ade80;
      --red:        #f87171;
      --radius:     16px;
      --radius-sm:  10px;
      --shadow:     0 8px 32px rgba(0,0,0,0.4);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout shell ─────────────────────────────────────────────────── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 1px;
    }

    /* ── Quick chips ──────────────────────────────────────────────────── */
    .chips-row {
      display: flex;
      gap: 8px;
      padding: 14px 24px;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: rgba(124, 111, 247, 0.1);
    }

    /* ── Messages area ────────────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
    }

    /* ── Message rows ─────────────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease-out both;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatars */
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .avatar.bot {
      background: linear-gradient(135deg, var(--accent), #c084fc);
      color: #fff;
    }

    .avatar.user {
      background: var(--surface2);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* Bubbles */
    .bubble {
      max-width: 72%;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.65;
      word-break: break-word;
      position: relative;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg-row.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Markdown-like formatting inside bot bubbles */
    .bubble strong { font-weight: 600; color: var(--accent2); }
    .bubble em { font-style: italic; color: var(--text-dim); }
    .bubble .sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .bubble .pg-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .bubble .pg-card + .pg-card { margin-top: 8px; }

    .bubble .pg-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .bubble .pg-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 500;
    }
    .badge.green { background: rgba(74,222,128,0.12); color: var(--green); }
    .badge.purple { background: rgba(124,111,247,0.15); color: var(--accent2); }
    .badge.red { background: rgba(248,113,113,0.12); color: var(--red); }
    .badge.gray { background: var(--surface); color: var(--text-dim); }

    .verified-tick { color: var(--green); font-size: 0.8rem; }
    .unverified { color: var(--text-dim); font-size: 0.75rem; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-6px); opacity: 1; }
    }

    /* Timestamp */
    .ts {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 4px;
      padding: 0 4px;
      text-align: right;
    }
    .msg-row.bot .ts { text-align: left; }

    /* ── Input area ───────────────────────────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 10px 10px 18px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(124, 111, 247, 0.4);
      box-shadow: 0 0 0 3px rgba(124, 111, 247, 0.08);
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    #msgInput::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent2);
      transform: scale(1.04);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── Welcome card ─────────────────────────────────────────────────── */
    .welcome-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin: 8px 0 4px;
    }

    .welcome-card .wc-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .welcome-card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .welcome-card p {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* ── Language tag on message ─────────────────────────────────────── */
    .lang-tag {
      font-size: 0.62rem;
      background: rgba(124,111,247,0.15);
      color: var(--accent2);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .messages { padding: 16px; gap: 14px; }
      .bubble { max-width: 88%; font-size: 0.86rem; }
      .chips-row { padding: 10px 16px; }
      .input-area { padding: 12px 16px 16px; }
      .header { padding: 14px 16px; }
    }
  </style>
</head>

<body>
<div class="shell">

  <!-- Header -->
    <header class="header">
    <div class="brand">
      <div class="brand-icon">🏠</div>
      <div class="brand-text">
        <h1>Quanta</h1>
        <p>StayPoint PG Assistant</p>
      </div>
    </div>
  </header>

  <!-- Quick suggestion chips -->
  <div class="chips-row" id="chipsRow">
    <button class="chip" onclick="chipSend(this)">PG under ₹6000 with WiFi</button>
    <button class="chip" onclick="chipSend(this)">Best rated PGs in Asansol</button>
    <button class="chip" onclick="chipSend(this)">Girls PG with meals</button>
    <button class="chip" onclick="chipSend(this)">Documents required for PG</button>
    <button class="chip" onclick="chipSend(this)">What is security deposit?</button>
    <button class="chip" onclick="chipSend(this)">PG notice period rules</button>
    <button class="chip" onclick="chipSend(this)">WiFi wala PG 6000 mein</button>
    <button class="chip" onclick="chipSend(this)">Meyeder PG dekhao</button>
  </div>

  <!-- Messages -->
  <div class="messages" id="msgList">

    <!-- Welcome card (shown once, removed on first message) -->
    <div class="welcome-card" id="welcomeCard">
      <div class="wc-icon">🏠</div>
      <h2>Welcome to Quanta</h2>
      <p>
        I'm your dedicated PG assistant for <strong>StayPoint</strong>.<br>
        Ask me to find PGs in Asansol, or ask about PG rules, documents, deposits, and more.<br><br>
        <em>Supports English · हिंदी · বাংলা</em>
      </p>
    </div>

  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="msgInput"
        rows="1"
        placeholder="Ask about PGs… e.g. 'Girls PG under ₹6000 with WiFi'"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>

</div><!-- .shell -->

<script>
// ─── State ─────────────────────────────────────────────────────────────────
const msgList  = document.getElementById('msgList');
const msgInput = document.getElementById('msgInput');
const sendBtn  = document.getElementById('sendBtn');
let   isTyping = false;

// ─── Auto-grow textarea ────────────────────────────────────────────────────
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

// ─── Send on Enter (Shift+Enter = newline) ─────────────────────────────────
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

// ─── Chip shortcut ─────────────────────────────────────────────────────────
function chipSend(el) {
  msgInput.value = el.textContent.trim();
  sendMessage();
}

// ─── Time helper ───────────────────────────────────────────────────────────
function nowTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ─── Remove welcome card ───────────────────────────────────────────────────
function removeWelcome() {
  const wc = document.getElementById('welcomeCard');
  if (wc) wc.remove();
}

// ─── Append user message ───────────────────────────────────────────────────
function appendUser(text) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div>
      <div class="bubble">${escHtml(text)}</div>
      <div class="ts">${nowTime()}</div>
    </div>
    <div class="avatar user">U</div>
  `;
  msgList.appendChild(row);
  scrollDown();
}

// ─── Typing indicator ──────────────────────────────────────────────────────
function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `
    <div class="avatar bot">Q</div>
    <div class="bubble bot-typing">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  msgList.appendChild(row);
  scrollDown();
}

function hideTyping() {
  const tr = document.getElementById('typingRow');
  if (tr) tr.remove();
}

// ─── Append bot message ────────────────────────────────────────────────────
function appendBot(text, pgs) {
  hideTyping();
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  const bubbleEl = document.createElement('div');
  bubbleEl.className = 'bubble';

  if (pgs && pgs.length > 0) {
    // Render lead text
    const parts = text.split('\n\n---\n\n');
    const lead  = parts[0];

    bubbleEl.innerHTML = formatBotText(lead);

    // Render individual PG cards
    pgs.forEach((pg, i) => {
      const card = buildPgCard(pg, i + 1);
      bubbleEl.appendChild(card);
    });
  } else {
    bubbleEl.innerHTML = formatBotText(text);
  }

  const wrapper = document.createElement('div');
  wrapper.appendChild(bubbleEl);
  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = nowTime();
  wrapper.appendChild(ts);

  row.innerHTML = `<div class="avatar bot">Q</div>`;
  row.appendChild(wrapper);
  msgList.appendChild(row);
  scrollDown();
}

// ─── Format bot text (bold, newlines) ─────────────────────────────────────
function formatBotText(text) {
  return escHtml(text)
    // **bold**
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // *italic*
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // newlines
    .replace(/\n/g, '<br>');
}

// ─── Build a PG card element ───────────────────────────────────────────────
function buildPgCard(pg, idx) {
  const card = document.createElement('div');
  card.className = 'pg-card';

  const verified   = String(pg.Verified || '').toLowerCase().startsWith('y');
  const wifiBadge  = pg.WiFi  === 'Yes' ? '<span class="badge green">📶 WiFi</span>'  : '<span class="badge gray">No WiFi</span>';
  const mealsBadge = pg.Meals === 'Yes' ? '<span class="badge green">🍽 Meals</span>' : '<span class="badge gray">No Meals</span>';
  const acBadge    = pg.AC    === 'Yes' ? '<span class="badge purple">❄️ AC</span>'    : '';
  const vBadge     = verified
    ? '<span class="badge green">✅ Verified</span>'
    : '<span class="badge gray">Unverified</span>';

  card.innerHTML = `
    <div class="pg-name">${idx}. ${escHtml(pg.PG_Name || 'PG')}</div>
    <div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:6px">📍 ${escHtml(pg.Address || 'Asansol')}</div>
    <div class="pg-row">
      <span class="badge purple">💰 ₹${pg.Rent || 'N/A'}/mo</span>
      <span class="badge purple">⭐ ${pg.Rating || 'N/A'}</span>
      <span class="badge gray">📏 ${pg.Distance_km || 'N/A'} km</span>
      <span class="badge gray">👤 ${pg.Gender_Preference || 'Any'}</span>
    </div>
    <div class="pg-row" style="margin-top:6px">
      ${wifiBadge} ${mealsBadge} ${acBadge} ${vBadge}
    </div>
    <div style="font-size:0.76rem;color:var(--text-dim);margin-top:6px">📞 ${escHtml(String(pg.Contact || 'N/A'))}</div>
  `;
  return card;
}

// ─── Main send function ────────────────────────────────────────────────────
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isTyping) return;

  isTyping = true;
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;

  appendUser(text);
  showTyping();

  try {
    const res  = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    appendBot(data.answer || 'Sorry, no response.', data.pgs || []);
  } catch {
    appendBot('⚠️ Connection error. Please try again.', []);
  } finally {
    isTyping = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function scrollDown() {
  msgList.scrollTo({ top: msgList.scrollHeight, behavior: 'smooth' });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
